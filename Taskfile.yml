version: "3"

tasks:
  brand:generate:
    desc: Generate brand assets
    cmds:
      - python3 scripts/brand_generate.py --generate

  brand:check:
    desc: Check brand assets are current
    cmds:
      - python3 scripts/brand_generate.py --check

  docs:build:
    desc: Build documentation
    cmds:
      - zensical build

  docs:check:
    desc: Build documentation with strict checks
    cmds:
      - zensical build --strict

  version:check:
    desc: Validate npm-compatible YYYY.M.D CalVer metadata
    cmds:
      - python3 scripts/check_calver.py
      - python3 -m unittest discover -s tests -p test_calver.py

  check:
    desc: Run documentation and version review gates
    cmds:
      - task: docs:check
      - task: version:check
