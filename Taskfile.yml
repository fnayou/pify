version: "3"

tasks:
  brand:generate:
    desc: Generate brand assets
    cmds:
      - python3 scripts/brand_generate.py --generate

  brand:check:
    desc: Check brand assets are current
    cmds:
      - python3 scripts/brand_generate.py --check
      - python3 -m unittest discover -s tests -p test_brand.py

  docs:build:
    desc: Build documentation
    cmds:
      - zensical build

  docs:check:
    desc: Build documentation and check public bootstrap status
    cmds:
      - zensical build --strict
      - python3 scripts/check_public_status.py

  version:check:
    desc: Validate npm-compatible YYYY.M.PATCH CalVer metadata
    cmds:
      - python3 scripts/check_calver.py
      - python3 -m unittest discover -s tests -p test_calver.py

  check:
    desc: Run brand, documentation, and version review gates
    cmds:
      - task: brand:check
      - task: docs:check
      - task: version:check
