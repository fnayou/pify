name: Live GitHub update smoke

on:
  workflow_dispatch:
    inputs:
      from_commit:
        description: Reviewed full commit A reachable from main
        required: true
        type: string
      to_commit:
        description: Descendant full commit B reachable from main
        required: true
        type: string

permissions:
  contents: read

jobs:
  update:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PIFY_FROM_COMMIT: ${{ inputs.from_commit }}
      PIFY_TO_COMMIT: ${{ inputs.to_commit }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require reviewed main commits
        shell: bash
        run: |
          for commit in "$PIFY_FROM_COMMIT" "$PIFY_TO_COMMIT"; do
            if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Both commits must be full lowercase Git hashes" >&2
              exit 1
            fi
          done
          git merge-base --is-ancestor "$PIFY_FROM_COMMIT" "$PIFY_TO_COMMIT"
          git merge-base --is-ancestor "$PIFY_TO_COMMIT" HEAD
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.4"
      # actions/setup-python v7.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install Pi 1.6.0 in isolated prefix
        run: |
          npm install --global --prefix "$RUNNER_TEMP/pi-runtime" --ignore-scripts @earendil-works/pi-coding-agent@1.6.0
          echo "$RUNNER_TEMP/pi-runtime/bin" >> "$GITHUB_PATH"
      - name: Rehearse reviewed public Git pin update in disposable agent
        run: python3 scripts/smoke_pi_public_git_update.py "$PIFY_FROM_COMMIT" "$PIFY_TO_COMMIT"
