name: Brand

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Brand assets are current
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check committed brand output
        run: python3 scripts/brand_generate.py --check
