name: Live GitHub source smoke

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full reviewed commit reachable from main
        required: true
        type: string

permissions:
  contents: read

jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PIFY_REVIEWED_COMMIT: ${{ inputs.commit }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require reviewed main commit
        shell: bash
        run: |
          if [[ ! "$PIFY_REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Commit must be a full lowercase Git hash" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$PIFY_REVIEWED_COMMIT" HEAD; then
            echo "Commit must be reachable from main" >&2
            exit 1
          fi
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.4"
      # actions/setup-python v7.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install Pi 1.5.2 in isolated prefix
        run: |
          npm install --global --prefix "$RUNNER_TEMP/pi-runtime" --ignore-scripts @earendil-works/pi-coding-agent@1.5.2
          echo "$RUNNER_TEMP/pi-runtime/bin" >> "$GITHUB_PATH"
      - name: Exercise public GitHub pin in disposable agents
        run: python3 scripts/smoke_pi_live_github.py "$PIFY_REVIEWED_COMMIT"
