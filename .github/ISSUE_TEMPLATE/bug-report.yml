name: Bug report
description: Report a defect in current documentation, CI, or brand assets.
title: "[Bug]: "
labels:
  - needs-triage
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: List the steps or inputs that reproduce the defect.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant environment
      description: Include relevant OS, browser, tool, and version details.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Non-sensitive logs
      description: Remove credentials, private data, and other sensitive details.
    validations:
      required: false
